<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="title"> Rock Paper Scissors </div>
    <div class = "container">
        <div class="choices">
            <div class ="Status"> </div>
            <div class="scoreboard"> 
                <div class="R"> </div>
                <div class="P"> </div>
                <div class="S"> </div>
            </div>
            
            
            <div class="split">
                <div class = "Rock"> 
                    <img src="rock.jpeg">
                    <div id ="Rock"> Rock </div>
                </div>

                <div class = "Paper"> 
                    <img src="paper.jpeg">
                    <div id ="Paper"> Paper </div>
                </div>

                <div class = "Scissors"> 
                    <img src="scissors.png">
                    <div id ="Scissors"> Scissors </div>
                </div>

            </div>
    </div>
</div>
    <script src="index.js"></script>
</body>

</html>
